; PlatformIO build file.
;
; Why this exists: the ESP8266 Arduino core ships Intel-only (x86_64) build
; tools, so plain arduino-cli cannot compile on an Apple Silicon Mac unless
; Rosetta 2 is installed. PlatformIO publishes a native arm64 Xtensa
; toolchain, so this is the build that works on this machine out of the box.
;
; The project is still an ordinary arduino-cli sketch. Nothing in here
; changes a single line of the code - see README section 10 for both paths.

[platformio]
src_dir = desky

[env:nodemcuv2]
platform      = espressif8266
board         = nodemcuv2
framework     = arduino
monitor_speed = 115200

lib_deps =
    olikraus/U8g2@^2.36.18
    miguelbalboa/MFRC522@^1.4.12
